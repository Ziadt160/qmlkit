[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "qmlkit"
version = "0.1.0"
description = "A backend-agnostic quantum machine learning library for SpinQit, Qiskit, Cirq and PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ziad Tarek Mohammed" }]
keywords = ["quantum", "machine-learning", "qml", "spinqit", "qiskit", "cirq", "pytorch", "variational"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
# SpinQit ships wheels for 3.8-3.10 only and pins numpy<2, so it is gated by an
# environment marker: the extra resolves cleanly (to nothing) on 3.11+.
spinqit = [
  "spinqit==0.2.4; python_version<'3.11'",
  "numpy<2; python_version<'3.11'",
]
qiskit = ["qiskit>=1.0"]
cirq = ["cirq-core>=1.3"]
sklearn = ["scikit-learn>=1.0"]
viz = ["matplotlib>=3.5"]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.5",
  "mypy>=1.8",
  "hypothesis>=6",
]
pennylane = ["pennylane>=0.40"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/Ziadt160/qmlkit"
Source = "https://github.com/Ziadt160/qmlkit"
Issues = "https://github.com/Ziadt160/qmlkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qmlkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "spinqit: needs SpinQit (Python 3.8-3.10 only)",
  "qiskit: needs Qiskit",
  "cirq: needs Cirq",
  "torch: needs PyTorch",
  "pennylane: cross-validation against PennyLane",
]

[tool.coverage.run]
source = ["qmlkit"]
parallel = true

# Coverage records absolute paths, and the matrix runs on three operating systems:
# ubuntu under /home/runner, macOS under /Users/runner, Windows under D:\a.
# The combining job runs on ubuntu, so without this it cannot match the other two
# and silently reports "skipped 2" -- the combined number, which is one of the
# project's headline claims, was then simply not being computed.
# Single-quoted TOML strings are literal, which is what Windows paths need.
[tool.coverage.paths]
source = [
  "src/qmlkit",
  "*/src/qmlkit",
  '*\src\qmlkit',
  "*/site-packages/qmlkit",
  '*\site-packages\qmlkit',
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]

[tool.mypy]
# Deliberately no `python_version`. Pinning it to 3.10 makes mypy parse *dependency*
# stubs as 3.10 too, and NumPy's stubs now use PEP 695 `type` statements, which is a
# syntax error before 3.12 — so the whole check aborts on any modern NumPy. The
# 3.10-compatibility signal comes from CI running this on 3.10 instead.
files = ["src/qmlkit/core", "src/qmlkit/gradients", "src/qmlkit/ansatz"]
strict = true
warn_return_any = false

# Optional SDKs ship no type stubs (or stubs we do not want to depend on). Silencing
# just these keeps `mypy --strict` meaningful for everything we actually own.
[[tool.mypy.overrides]]
module = ["spinqit.*", "qiskit.*", "cirq.*", "torch.*"]
ignore_missing_imports = true
