[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "qmlkit"
version = "0.1.1"
description = "A quantum machine learning library with the diagnostics to catch mistakes that do not raise, on SpinQit, Qiskit, Cirq and PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ziad Tarek Mohammed" }]
keywords = ["quantum", "machine-learning", "qml", "spinqit", "qiskit", "cirq", "pytorch", "variational"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
# SpinQit ships wheels for 3.8-3.10 only and pins numpy<2, so it is gated by an
# environment marker: the extra resolves cleanly (to nothing) on 3.11+.
spinqit = [
  "spinqit==0.2.4; python_version<'3.11'",
  "numpy<2; python_version<'3.11'",
]
qiskit = ["qiskit>=1.0"]
cirq = ["cirq-core>=1.3"]
# Aer is a separate distribution from Qiskit, and the only way to get a
# Qiskit noise model. Installing [qiskit] does not bring it in.
aer = ["qiskit-aer>=0.14", "qiskit>=1.0"]
sklearn = ["scikit-learn>=1.0"]
viz = ["matplotlib>=3.5"]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  # Pinned to a minor: `ruff format` changes its mind between releases, and CI runs
  # `ruff format --check` as a gate. An unpinned range turned that gate red across 18
  # untouched files without a commit going near them.
  "ruff>=0.15,<0.16",
  "mypy>=1.8",
  "hypothesis>=6",
]
pennylane = ["pennylane>=0.40"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://ziadt160.github.io/qmlkit/"
Documentation = "https://ziadt160.github.io/qmlkit/"
Source = "https://github.com/Ziadt160/qmlkit"
Changelog = "https://github.com/Ziadt160/qmlkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ziadt160/qmlkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qmlkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "spinqit: needs SpinQit (Python 3.8-3.10 only)",
  "qiskit: needs Qiskit",
  "cirq: needs Cirq",
  "noisy: needs a mixed-state simulator (cirq or qiskit-aer)",
  "torch: needs PyTorch",
  "pennylane: cross-validation against PennyLane",
]

[tool.coverage.run]
source = ["qmlkit"]
parallel = true

# Coverage records absolute paths, and the matrix runs on three operating systems:
# ubuntu under /home/runner, macOS under /Users/runner, Windows under D:\a.
# The combining job runs on ubuntu, so without this it cannot match the other two
# and silently reports "skipped 2" -- the combined number, which is one of the
# project's headline claims, was then simply not being computed.
# Single-quoted TOML strings are literal, which is what Windows paths need.
[tool.coverage.paths]
source = [
  "src/qmlkit",
  "*/src/qmlkit",
  '*\src\qmlkit',
  "*/site-packages/qmlkit",
  '*\site-packages\qmlkit',
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]

[tool.mypy]
# Deliberately no `python_version`. Pinning it to 3.10 makes mypy parse *dependency*
# stubs as 3.10 too, and NumPy's stubs now use PEP 695 `type` statements, which is a
# syntax error before 3.12 — so the whole check aborts on any modern NumPy. The
# 3.10-compatibility signal comes from CI running this on 3.10 instead.
# The whole package. It was six paths until the rest was made to pass; a partial
# check reads like a full one in CI, which is the worst of both.
files = ["src/qmlkit"]
strict = true
warn_return_any = false

# Optional SDKs ship no type stubs (or stubs we do not want to depend on). Silencing
# just these keeps `mypy --strict` meaningful for everything we actually own.
# ``qmlkit.nn`` subclasses ``torch.nn.Module``, and torch is an optional extra. Where
# it is absent the base class resolves to ``Any`` and --strict objects to subclassing
# it -- so the package would type-check only on machines that happen to have torch,
# which is the opposite of what a type check is for. These two rules are about
# *third-party* base classes and decorators; everything else stays strict.
[[tool.mypy.overrides]]
module = ["qmlkit.nn.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
# and for the same reason an ignore here can be necessary or redundant depending on
# whether torch is installed -- `Function.apply` is untyped upstream when it is, and
# Any when it is not. Flagging the unused case would make the two environments
# disagree about a comment.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
  "spinqit.*",
  "qiskit.*",
  "qiskit_aer.*",
  "cirq.*",
  "sympy.*",
  "sklearn.*",
  "torch.*",
  "pennylane.*",
]
ignore_missing_imports = true
